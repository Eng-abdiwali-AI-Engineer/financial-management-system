services:
  - type: web
    name: financial-management-system
    runtime: node
    buildCommand: npm install && npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: NODE_VERSION
        value: "22"